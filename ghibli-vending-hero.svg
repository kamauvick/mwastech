<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Enhanced gradients for vibrant Ghibli-style lighting -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E0F6FF;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#98FB98;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4B5;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="machineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#357ABD;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#32CD32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="leafGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#98FB98;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#32CD32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="machineAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="sunGlow" cx="80%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FF6347;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="800" height="400" fill="url(#skyGradient)"/>
  
  <!-- Ground -->
  <ellipse cx="400" cy="580" rx="400" ry="80" fill="url(#groundGradient)"/>
  
  <!-- Floating leaves (Ghibli-style) -->
  <g opacity="0.7">
    <ellipse cx="150" cy="120" rx="8" ry="12" fill="url(#leafGradient)" transform="rotate(45 150 120)"/>
    <ellipse cx="650" cy="80" rx="6" ry="10" fill="url(#leafGradient)" transform="rotate(-30 650 80)"/>
    <ellipse cx="200" cy="200" rx="5" ry="8" fill="url(#leafGradient)" transform="rotate(60 200 200)"/>
    <ellipse cx="700" cy="180" rx="7" ry="11" fill="url(#leafGradient)" transform="rotate(-45 700 180)"/>
  </g>
  
  <!-- Clouds (soft Ghibli style) -->
  <g opacity="0.8">
    <ellipse cx="150" cy="100" rx="30" ry="15" fill="#FFFFFF"/>
    <ellipse cx="170" cy="95" rx="25" ry="12" fill="#FFFFFF"/>
    <ellipse cx="130" cy="105" rx="20" ry="10" fill="#FFFFFF"/>
    
    <ellipse cx="600" cy="80" rx="35" ry="18" fill="#FFFFFF"/>
    <ellipse cx="625" cy="75" rx="28" ry="14" fill="#FFFFFF"/>
    <ellipse cx="575" cy="85" rx="22" ry="11" fill="#FFFFFF"/>
  </g>
  
  <!-- Main vending machine -->
  <g transform="translate(250, 150)">
    <!-- Machine shadow -->
    <ellipse cx="150" cy="400" rx="80" ry="15" fill="#000000" opacity="0.2"/>
    
    <!-- Machine body -->
    <rect x="50" y="50" width="200" height="350" rx="15" fill="url(#machineGradient)" stroke="#1e40af" stroke-width="2"/>
    
    <!-- Machine top -->
    <rect x="45" y="45" width="210" height="20" rx="10" fill="#1e40af"/>
    
    <!-- Display screen -->
    <rect x="70" y="80" width="160" height="100" rx="8" fill="#000000" stroke="#374151" stroke-width="2"/>
    <rect x="75" y="85" width="150" height="90" rx="5" fill="#1f2937"/>
    
    <!-- Screen content -->
    <text x="150" y="110" text-anchor="middle" font-family="Arial" font-size="12" fill="#00ff00">MWASTECH</text>
    <text x="150" y="130" text-anchor="middle" font-family="Arial" font-size="10" fill="#00ff00">SELECT PRODUCT</text>
    <rect x="85" y="140" width="40" height="20" fill="#22c55e" rx="3"/>
    <rect x="135" y="140" width="40" height="20" fill="#f59e0b" rx="3"/>
    <rect x="185" y="140" width="40" height="20" fill="#3b82f6" rx="3"/>
    
    <!-- Product display area -->
    <rect x="70" y="200" width="160" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Product bottles/containers -->
    <g opacity="0.8">
      <!-- Milk bottles -->
      <rect x="85" y="220" width="12" height="25" rx="2" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="100" y="220" width="12" height="25" rx="2" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="115" y="220" width="12" height="25" rx="2" fill="#ffffff" stroke="#e5e7eb"/>
      
      <!-- Oil containers -->
      <rect x="140" y="225" width="15" height="20" rx="2" fill="#fbbf24"/>
      <rect x="158" y="225" width="15" height="20" rx="2" fill="#fbbf24"/>
      
      <!-- Water bottles -->
      <rect x="185" y="220" width="12" height="25" rx="2" fill="#bfdbfe" stroke="#93c5fd"/>
      <rect x="200" y="220" width="12" height="25" rx="2" fill="#bfdbfe" stroke="#93c5fd"/>
      
      <!-- Second row -->
      <rect x="85" y="250" width="12" height="25" rx="2" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="100" y="250" width="12" height="25" rx="2" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="140" y="255" width="15" height="20" rx="2" fill="#fbbf24"/>
      <rect x="185" y="250" width="12" height="25" rx="2" fill="#bfdbfe" stroke="#93c5fd"/>
    </g>
    
    <!-- Selection buttons -->
    <g>
      <circle cx="100" cy="350" r="8" fill="#4ade80" stroke="#16a34a" stroke-width="1"/>
      <text x="100" y="355" text-anchor="middle" font-family="Arial" font-size="10" fill="#ffffff">A1</text>
      
      <circle cx="130" cy="350" r="8" fill="#4ade80" stroke="#16a34a" stroke-width="1"/>
      <text x="130" y="355" text-anchor="middle" font-family="Arial" font-size="10" fill="#ffffff">A2</text>
      
      <circle cx="160" cy="350" r="8" fill="#4ade80" stroke="#16a34a" stroke-width="1"/>
      <text x="160" y="355" text-anchor="middle" font-family="Arial" font-size="10" fill="#ffffff">A3</text>
      
      <circle cx="190" cy="350" r="8" fill="#4ade80" stroke="#16a34a" stroke-width="1"/>
      <text x="190" y="355" text-anchor="middle" font-family="Arial" font-size="10" fill="#ffffff">A4</text>
    </g>
    
    <!-- Coin slot and card reader -->
    <rect x="80" y="370" width="25" height="8" rx="4" fill="#374151"/>
    <rect x="115" y="365" width="40" height="18" rx="3" fill="#1f2937" stroke="#374151"/>
    <text x="135" y="376" text-anchor="middle" font-family="Arial" font-size="6" fill="#9ca3af">CARD</text>
    
    <!-- Dispensing area -->
    <rect x="170" y="360" width="50" height="30" rx="5" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <rect x="175" y="365" width="40" height="20" rx="3" fill="#111827"/>
  </g>
  
  <!-- Small tree (Ghibli style) -->
  <g transform="translate(50, 250)">
    <!-- Tree trunk -->
    <rect x="45" y="150" width="10" height="50" fill="#8B4513"/>
    <!-- Tree foliage -->
    <circle cx="50" cy="140" r="25" fill="#228B22"/>
    <circle cx="40" cy="130" r="20" fill="#32CD32"/>
    <circle cx="60" cy="125" r="18" fill="#90EE90"/>
  </g>
  
  <!-- Another small tree -->
  <g transform="translate(600, 280)">
    <rect x="45" y="120" width="8" height="40" fill="#8B4513"/>
    <circle cx="49" cy="115" r="20" fill="#228B22"/>
    <circle cx="42" cy="108" r="15" fill="#32CD32"/>
    <circle cx="56" cy="105" r="13" fill="#90EE90"/>
  </g>
  
  <!-- Flying birds (simple Ghibli style) -->
  <g opacity="0.6">
    <path d="M 120 60 Q 125 55 130 60 Q 125 65 120 60" fill="#4B5563"/>
    <path d="M 580 45 Q 585 40 590 45 Q 585 50 580 45" fill="#4B5563"/>
    <path d="M 300 70 Q 305 65 310 70 Q 305 75 300 70" fill="#4B5563"/>
  </g>
  
  <!-- Soft lighting effect -->
  <circle cx="200" cy="100" r="150" fill="url(#skyGradient)" opacity="0.1"/>
</svg>
